name: personal_secretary
description: Personal Secretary OS client (Android + Linux)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  # Endorsed Android impl: 2.4.18+ declares minSdk 24. Keep API 23.
  shared_preferences_android: '>=2.4.0 <2.4.18'
  record: ^6.0.0
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  # 6.3.21+ declares minSdk 24.
  url_launcher_android: '>=6.3.0 <6.3.21'
  # 2.0.34+ declares minSdk 24.
  flutter_plugin_android_lifecycle: '>=2.0.0 <2.0.34'
  desktop_drop: ^0.5.0
  crypto: ^3.0.6
  path: ^1.9.1
  csv: ^6.0.0
  flutter_timezone: ^4.1.0
  flutter_markdown: ^0.7.6
  archive: ^4.0.7
  xml: ^6.5.0
  dart_duckdb: ^1.4.4
  pdfrx: ^2.2.24
  kalender: 0.29.1
  # Android + Linux TTS playback. Plugin minSdk 19; guaranteed support >= 23.
  # Smallest maintained player with stop(); not a full media framework.
  audioplayers: ^6.1.0
  graphview: 1.5.1
  # V2 geometry only. The current renderer and V1 GraphView stay in place.
  elk: 0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/voice_start.wav
    - assets/sounds/voice_stop.wav
