services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secretary}
      POSTGRES_USER: ${POSTGRES_USER:-secretary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretary}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-secretary} -d ${POSTGRES_DB:-secretary}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-secretary}
      POSTGRES_USER: ${POSTGRES_USER:-secretary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretary}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-alloy}
      SECRETARY_TIMEZONE: ${SECRETARY_TIMEZONE:-Europe/Amsterdam}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_FILE: ${GOOGLE_OAUTH_CLIENT_FILE:-/run/secrets/google-oauth-client.json}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:18080/auth/google/callback}
      SECRETARY_CREDENTIAL_KEY: ${SECRETARY_CREDENTIAL_KEY:-}
      MATTERMOST_ALLOWED_BASE_URLS: ${MATTERMOST_ALLOWED_BASE_URLS:-}
      MATTERMOST_SYNC_DAYS: ${MATTERMOST_SYNC_DAYS:-14}
      MATTERMOST_SYNC_MAX_CHANNELS: ${MATTERMOST_SYNC_MAX_CHANNELS:-50}
      MATTERMOST_SYNC_INITIAL_POSTS_PER_CHANNEL: ${MATTERMOST_SYNC_INITIAL_POSTS_PER_CHANNEL:-100}
      MATTERMOST_SYNC_MAX_POSTS_PER_RUN: ${MATTERMOST_SYNC_MAX_POSTS_PER_RUN:-500}
      MATTERMOST_SYNC_OVERLAP_SECONDS: ${MATTERMOST_SYNC_OVERLAP_SECONDS:-300}
      SOURCE_SYNC_MATTERMOST_INTERVAL_SECONDS: ${SOURCE_SYNC_MATTERMOST_INTERVAL_SECONDS:-120}
      SOURCE_SYNC_USER_MIN_INTERVAL_SECONDS: ${SOURCE_SYNC_USER_MIN_INTERVAL_SECONDS:-60}
      SOURCE_SYNC_USER_MAX_INTERVAL_SECONDS: ${SOURCE_SYNC_USER_MAX_INTERVAL_SECONDS:-86400}
      SOURCE_SYNC_USER_MIN_HISTORY_DAYS: ${SOURCE_SYNC_USER_MIN_HISTORY_DAYS:-1}
      SOURCE_SYNC_USER_MAX_HISTORY_DAYS: ${SOURCE_SYNC_USER_MAX_HISTORY_DAYS:-90}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_MTPROTO_AI_ENABLED: ${TELEGRAM_MTPROTO_AI_ENABLED:-false}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:18080/auth/teams/callback}
      MICROSOFT_TEAMS_NOTIFICATION_URL: ${MICROSOFT_TEAMS_NOTIFICATION_URL:-}
      SOURCE_SYNC_TEAMS_INTERVAL_SECONDS: ${SOURCE_SYNC_TEAMS_INTERVAL_SECONDS:-900}
      RESOURCE_UPLOAD_ROOT: /var/lib/secretary/resources
      LOCAL_FILES_ROOT: /var/lib/secretary/local-files
    volumes:
      - ../secrets/google-oauth-client.json:/run/secrets/google-oauth-client.json:ro
      - resource_data:/var/lib/secretary/resources
      - local_files_data:/var/lib/secretary/local-files
    ports:
      - "${SECRETARY_API_BIND:-0.0.0.0:8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-secretary}
      POSTGRES_USER: ${POSTGRES_USER:-secretary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretary}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-alloy}
      SECRETARY_TIMEZONE: ${SECRETARY_TIMEZONE:-Europe/Amsterdam}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_FILE: ${GOOGLE_OAUTH_CLIENT_FILE:-/run/secrets/google-oauth-client.json}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:18080/auth/google/callback}
      SECRETARY_CREDENTIAL_KEY: ${SECRETARY_CREDENTIAL_KEY:-}
      MATTERMOST_ALLOWED_BASE_URLS: ${MATTERMOST_ALLOWED_BASE_URLS:-}
      MATTERMOST_SYNC_DAYS: ${MATTERMOST_SYNC_DAYS:-14}
      MATTERMOST_SYNC_MAX_CHANNELS: ${MATTERMOST_SYNC_MAX_CHANNELS:-50}
      MATTERMOST_SYNC_INITIAL_POSTS_PER_CHANNEL: ${MATTERMOST_SYNC_INITIAL_POSTS_PER_CHANNEL:-100}
      MATTERMOST_SYNC_MAX_POSTS_PER_RUN: ${MATTERMOST_SYNC_MAX_POSTS_PER_RUN:-500}
      MATTERMOST_SYNC_OVERLAP_SECONDS: ${MATTERMOST_SYNC_OVERLAP_SECONDS:-300}
      SOURCE_SYNC_MATTERMOST_INTERVAL_SECONDS: ${SOURCE_SYNC_MATTERMOST_INTERVAL_SECONDS:-120}
      SOURCE_SYNC_USER_MIN_INTERVAL_SECONDS: ${SOURCE_SYNC_USER_MIN_INTERVAL_SECONDS:-60}
      SOURCE_SYNC_USER_MAX_INTERVAL_SECONDS: ${SOURCE_SYNC_USER_MAX_INTERVAL_SECONDS:-86400}
      SOURCE_SYNC_USER_MIN_HISTORY_DAYS: ${SOURCE_SYNC_USER_MIN_HISTORY_DAYS:-1}
      SOURCE_SYNC_USER_MAX_HISTORY_DAYS: ${SOURCE_SYNC_USER_MAX_HISTORY_DAYS:-90}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_MTPROTO_AI_ENABLED: ${TELEGRAM_MTPROTO_AI_ENABLED:-false}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:18080/auth/teams/callback}
      MICROSOFT_TEAMS_NOTIFICATION_URL: ${MICROSOFT_TEAMS_NOTIFICATION_URL:-}
      SOURCE_SYNC_TEAMS_INTERVAL_SECONDS: ${SOURCE_SYNC_TEAMS_INTERVAL_SECONDS:-900}
      RESOURCE_UPLOAD_ROOT: /var/lib/secretary/resources
      LOCAL_FILES_ROOT: /var/lib/secretary/local-files
    volumes:
      - ../secrets/google-oauth-client.json:/run/secrets/google-oauth-client.json:ro
      - resource_data:/var/lib/secretary/resources
      - local_files_data:/var/lib/secretary/local-files
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.worker.run

volumes:
  db_data:
  resource_data:
  local_files_data:
